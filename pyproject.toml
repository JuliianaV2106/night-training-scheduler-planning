[project]
name = "night-training-scheduler"
version = "2.0.0"
description = "Module 9: Night Training Scheduler — Academic AI Compute Fabric (Impl-2 Hardened System)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.115.0",
]

[tool.coverage.run]
source = ["domain"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
