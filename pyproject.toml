[project]
name = "night-training-scheduler"
version = "2.0.0"
description = "Module 9: Night Training Scheduler — Academic AI Compute Fabric (Impl-1 & Impl-2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "sortedcontainers>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.115.0",
    "ruff>=0.8.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "ruff>=0.8.6",
    "pytest-cov>=5.0.0",
]

[tool.coverage.run]
source = ["domain", "src/domain"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["planning", "_bmad", "_bmad-output", ".agents", ".claude", ".opencode"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/atdd/*" = ["E501"]
"test/atdd/*" = ["E501"]
"src/ports/dto.py" = ["E501"]
