    function renderCurrentSlide() {
      const s = slides[currentSlide];
      const container = document.getElementById('slide-container');
      container.classList.remove('slide-fade');
      void container.offsetWidth;
      container.classList.add('slide-fade');
      container.innerHTML = s.render();

      document.getElementById('rubric-pill').textContent = s.rubric;
      document.getElementById('slide-counter').textContent = `${currentSlide + 1} / ${slides.length}`;
      document.getElementById('progress-bar').style.width = `${((currentSlide + 1) / slides.length) * 100}%`;
      document.getElementById('speaker-notes-text').textContent = s.notes;
      document.getElementById('slide-timer-badge').textContent = `Tiempo sugerido: ${s.time}`;
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderCurrentSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderCurrentSlide();
      }
    }

    function goToSlide(idx) {
      currentSlide = idx;
      renderCurrentSlide();
    }

    function toggleNotes() {
      showNotes = !showNotes;
      const box = document.getElementById('speaker-notes-box');
      const btn = document.getElementById('notes-btn');
      box.style.display = showNotes ? 'block' : 'none';
      btn.textContent = showNotes ? '🎙️ Guion Orador: ON' : '🎙️ Guion Orador: OFF';
    }

    function setSimState(state) {
      simState = state;
      renderCurrentSlide();
    }

    function setTestTab(tab) {
      activeTestTab = tab;
      renderCurrentSlide();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'n' || e.key === 'N') toggleNotes();
    });

    renderCurrentSlide();
  </script>
