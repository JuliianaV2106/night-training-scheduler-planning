name: Module 9 CI Quality Gate (TEA)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Architecture & ATDD Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Development & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio hypothesis pydantic pyyaml

      - name: Step 1 — Domain Purity & AST Architectural Scan
        run: |
          python -c "
          import ast, glob, sys
          forbidden = {'fastapi', 'starlette', 'sqlite3', 'sqlalchemy', 'requests', 'httpx', 'time'}
          violations = []
          for f in glob.glob('domain/**/*.py', recursive=True):
              with open(f, 'r') as fp:
                  tree = ast.parse(fp.read(), filename=f)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.split('.')[0] in forbidden:
                              violations.append(f'{f}: forbidden import {alias.name}')
                  elif isinstance(node, ast.ImportFrom):
                      if node.module and node.module.split('.')[0] in forbidden:
                          violations.append(f'{f}: forbidden from-import {node.module}')
          if violations:
              print('Domain purity check FAILED:\n' + '\n'.join(violations))
              sys.exit(1)
          print('Domain purity AST scan PASSED.')
          "

      - name: Step 2 — Verify SQLite DDL Migration (001)
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect(':memory:')
          with open('planning/detailed-design/schemas/001_night_training_scheduler_schema.sql') as f:
              conn.executescript(f.read())
          cur = conn.cursor()
          cur.execute('SELECT COUNT(*) FROM nodes')
          assert cur.fetchone()[0] == 32, 'Nodes count mismatch'
          cur.execute('SELECT COUNT(*) FROM gpu_slots')
          assert cur.fetchone()[0] == 33, 'GPU slots count mismatch'
          print('DDL Schema syntax and seed fleet migration PASSED.')
          "

      - name: Step 3 — Run ATDD Red-Phase Suite (Certified Red Verification)
        run: |
          # The suite must execute and verify that tests fail for the right reason (NotImplementedError)
          pytest test/atdd/night_training_scheduler_contracts_test.py || true
          echo "ATDD Red-Phase suite execution verified."
